name: CI
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      MIX_ENV: test
      # Override the versions in mise.toml with the ones from the matrix
      MISE_ERLANG_VERSION: ${{ matrix.versions.erlang }}
      MISE_ELIXIR_VERSION: ${{ matrix.versions.elixir }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        versions:
          - elixir: 1.16.0-otp-26
            erlang: 26.2
          - elixir: 1.17.0-otp-27
            erlang: 27.3
          - elixir: 1.18.0-otp-27
            erlang: 27.3
          - elixir: 1.19.0-otp-28
            erlang: 28.0
          - elixir: 1.20.0-otp-29
            erlang: 29.0
    name: Elixir v${{ matrix.versions.elixir }}, Erlang v${{ matrix.versions.erlang }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v5

      - run: mix local.hex --force

      - run: mix local.rebar --force

      - uses: actions/cache@v3
        with:
          path: deps
          key: mix-deps-${{ hashFiles('**/mix.lock') }}

      - run: mix deps.get

      - run: mix format --check-formatted
        if: matrix.os != 'windows-latest'

      - run: mix deps.unlock --check-unused

      - run: mix deps.compile

      - run: mix compile --warnings-as-errors

      - run: mix test --warnings-as-errors
